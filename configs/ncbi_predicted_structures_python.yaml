# AquaEsterNet-StructMine preset: small local NCBI predicted-structure TM-align preview
#
# Place NCBI-named predicted structures such as NP_414543.1.pdb under
# data/ncbi/predicted_structures. This preview runs TM-align through tmtools
# and uses the target filename to retrieve NCBI Protein annotations.

query:
  pdb_file: data/query/Bur01m.pdb
  fasta_file: data/query/Bur01m_seed.fasta
  pdb_id: 8HFW
  chain: A
  residue_range: "12-294"
  source_url: https://www.rcsb.org/structure/8HFW

foldseek:
  executable: foldseek
  backend: auto
  wsl_distribution: Ubuntu-Foldseek
  wsl_executable: /opt/foldseek/bin/foldseek
  tmp_dir: tmp
  max_seqs: 1000
  threads: 16
  prepare_databases: false

search_databases:
  - name: ncbi_predicted_structures_python
    enabled: true
    kind: custom_structure
    search_engine: tmtools_tmalign
    structure_dir: data/ncbi/predicted_structures
    annotation_source: ncbi

filter:
  min_alntmscore: 0.35
  max_rmsd: 6.0
  min_qcov: 0.50
  min_tcov: 0.30
  min_alnlen: 120
  max_sequence_identity: 1.0

annotation:
  enable_rcsb: false
  enable_uniprot: false
  enable_ncbi: true
  enable_alphafold: false
  request_sleep_seconds: 0.34
  cache_dir: .cache/annotations
  max_records: 200

output:
  out_prefix: results/Bur01_vs_ncbi_predicted_structures_python
  run_root: results/runs
