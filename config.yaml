# Bur01-StructMine V1 configuration
# All paths are relative to this project root unless absolute paths are provided.

query:
  pdb_file: data/query/Bur01m.pdb
  fasta_file: data/query/Bur01m_seed.fasta

foldseek:
  executable: foldseek
  # Choose one target database after downloading/building it.
  # Example 1: databases/pdb100
  # Example 2: databases/afdb_proteome
  target_db: databases/pdb
  tmp_dir: tmp
  max_seqs: 1000
  threads: 8

filter:
  min_alntmscore: 0.45
  max_rmsd: 4.0
  min_qcov: 0.60
  min_tcov: 0.40
  min_alnlen: 180
  max_sequence_identity: 0.95

annotation:
  enable_rcsb: true
  enable_uniprot: true
  request_sleep_seconds: 0.15

output:
  out_prefix: results/Bur01_vs_database
