[project]
name = "aquaesternet-structmine"
version = "0.4.0"
description = "AquaEsterNet-StructMine: Bur01 structure mining, NR expansion, novelty audit, and local AlphaFold2 validation."
requires-python = ">=3.10"
dependencies = [
    "biopython>=1.83",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "requests>=2.31.0",
    "PyYAML>=6.0.1",
    "tqdm>=4.66.0",
    "pydantic>=2.13.4,<3",
    "tmtools==0.3.0",
    "streamlit>=1.59.1,<2",
    "plotly>=6.9.0,<7",
    "py3Dmol>=2.5.5,<3",
]

[project.optional-dependencies]
design = ["torch>=2.6,<3"]
dev = [
    "pytest>=9.1.1,<10",
    "playwright==1.61.0",
]

[project.scripts]
aquaesternet-structmine = "bur01_structmine.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
