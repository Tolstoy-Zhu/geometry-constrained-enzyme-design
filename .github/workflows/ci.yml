name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  non-gpu-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and tests
        run: python -m pip install -e . -r requirements-dev.txt
      - name: Dependency consistency
        run: python -m pip check
      - name: Compile source
        run: python -m compileall -q src ui tests
      - name: Required file audit
        run: python -m bur01_structmine.cli check-files
      - name: Non-GPU test suite
        env:
          AQUA_SKIP_GPU_CHECK: "1"
          AQUA_FAKE_COLABFOLD_VERSION: "1.6.1"
        run: python -m pytest -q
